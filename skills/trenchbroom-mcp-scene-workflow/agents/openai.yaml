interface:
  display_name: "TrenchBroom MCP Scene Workflow"
  short_description: "Guarded TrenchBroom scene build and review"
  default_prompt: "Use $trenchbroom-mcp-scene-workflow to build or replace a guarded TrenchBroom module, validate quality against a baseline, and report optional review evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "trenchbroom"
      description: "Local TrenchBroom HTTP MCP bridge"
      transport: "streamable_http"
      url: "http://127.0.0.1:37666/mcp/"

policy:
  allow_implicit_invocation: true
