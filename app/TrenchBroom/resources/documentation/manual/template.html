<!DOCTYPE html>
<html lang="$html-lang$">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="pandoc">
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("tb-manual-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.theme = stored;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.dataset.theme = "dark";
          } else {
            document.documentElement.dataset.theme = "light";
          }
        } catch (e) {}
      })();
    </script>
    $for(author-meta)$
    <meta name="author" content="$author-meta$">
    $endfor$
    <title>$pagetitle$</title>
    <link rel="icon" href="$resource-prefix$/images/icon.png">
    <link rel="stylesheet" href="$resource-prefix$/manual.css">
    <script src="$resource-prefix$/$shortcuts-file$"></script>
    <script src="$resource-prefix$/manual.js"></script>
  </head>
  <body data-search-empty="$search-empty$" data-search-no-results="$search-no-results$">
    <header class="manual-header">
      <div class="header-left">
        <button class="icon-button nav-toggle" type="button" aria-label="$navigation-toggle$" aria-controls="manual-navigation" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a class="header-brand-mobile" href="#">
          <img src="$resource-prefix$/images/icon.png" alt="" width="22" height="22">
          <strong>$manual-title$</strong>
        </a>
      </div>

      <div class="header-right">
        $if(manual-href)$
        <nav class="doc-switcher" aria-label="Documentation section switcher">
          <a href="$manual-href$"$if(manual-current)$ aria-current="page"$endif$>$manual-tab-label$</a>
          <a href="$api-href$"$if(api-current)$ aria-current="page"$endif$>$api-tab-label$</a>
        </nav>
        $endif$
        <nav class="language-switcher" aria-label="$language-label$">
          <a href="$english-href$"$if(english-current)$ aria-current="page"$endif$>EN</a>
          <a href="$chinese-href$"$if(chinese-current)$ aria-current="page"$endif$>中文</a>
        </nav>
        <button class="icon-button theme-toggle" type="button" aria-label="$theme-toggle$" title="$theme-toggle$">
          <svg class="theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="manual-shell">
      $if(toc)$
      <nav id="manual-navigation" class="manual-navigation" aria-label="$navigation-label$">
        <div class="sidebar-brand-container">
          <a class="sidebar-brand" href="#">
            <img src="$resource-prefix$/images/icon.png" alt="Logo" width="28" height="28">
            <div class="sidebar-brand-text">
              <strong>$manual-title$</strong>
              <span>__TB_BUILD_ID__</span>
            </div>
          </a>
        </div>

        <div class="sidebar-search-wrap">
          <label class="sidebar-search" for="manual-search-input">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="manual-search-input" type="search" autocomplete="off" placeholder="$search-placeholder$" aria-controls="manual-search-results" aria-expanded="false">
            <kbd>Ctrl K</kbd>
          </label>
          <div id="manual-search-results" class="manual-search-results" role="listbox" hidden></div>
        </div>

        <div class="manual-navigation-scroll">
          $toc$
        </div>
      </nav>
      <button class="navigation-scrim" type="button" aria-label="$navigation-close$" hidden></button>
      $endif$

      <main class="manual-content">
        <div class="manual-breadcrumb" aria-hidden="true">
          <span>$manual-label$</span>
          <svg class="breadcrumb-separator" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          <span id="current-section-label">$introduction-label$</span>
        </div>
        <article id="manual-article">
          $body$
        </article>
        <footer class="manual-footer">
          <span>TrenchBroom __TB_VERSION__</span>
          <a href="https://github.com/TrenchBroom/TrenchBroom" target="_blank" rel="noopener noreferrer">GitHub</a>
        </footer>
      </main>

      <aside class="page-navigation" aria-label="$page-navigation-label$">
        <div class="page-navigation-title">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          $page-navigation-label$
        </div>
        <nav id="page-navigation-links"></nav>
      </aside>
    </div>

    <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </body>
</html>
