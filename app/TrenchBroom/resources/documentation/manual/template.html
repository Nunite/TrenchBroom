<!DOCTYPE html>
<html lang="$html-lang$">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="pandoc">
    $for(author-meta)$
    <meta name="author" content="$author-meta$">
    $endfor$
    <title>$pagetitle$</title>
    <link rel="icon" href="$resource-prefix$/images/icon.png">
    <link rel="stylesheet" href="$resource-prefix$/manual.css">
    <script src="$resource-prefix$/$shortcuts-file$"></script>
    <script src="$resource-prefix$/manual.js"></script>
  </head>
  <body data-search-empty="$search-empty$" data-search-no-results="$search-no-results$">
    <header class="manual-header">
      <div class="manual-brand">
        <button class="icon-button nav-toggle" type="button" aria-label="$navigation-toggle$" aria-controls="manual-navigation" aria-expanded="false">&#9776;</button>
        <img src="$resource-prefix$/images/icon.png" alt="" width="28" height="28">
        <div class="manual-brand-copy">
          <strong>$manual-title$</strong>
          <span>__TB_BUILD_ID__</span>
        </div>
      </div>

      <div class="manual-search-wrap">
        <label class="manual-search" for="manual-search-input">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="manual-search-input" type="search" autocomplete="off" placeholder="$search-placeholder$" aria-controls="manual-search-results" aria-expanded="false">
          <kbd>Ctrl K</kbd>
        </label>
        <div id="manual-search-results" class="manual-search-results" role="listbox" hidden></div>
      </div>

      <div class="manual-actions">
        <nav class="language-switcher" aria-label="$language-label$">
          <a href="$english-href$"$if(english-current)$ aria-current="page"$endif$>EN</a>
          <a href="$chinese-href$"$if(chinese-current)$ aria-current="page"$endif$>中文</a>
        </nav>
        <button class="icon-button theme-toggle" type="button" aria-label="$theme-toggle$" title="$theme-toggle$">&#9680;</button>
      </div>
    </header>

    <div class="manual-shell">
      $if(toc)$
      <nav id="manual-navigation" class="manual-navigation" aria-label="$navigation-label$">
        <div class="manual-navigation-title">$contents-label$</div>
        <div class="manual-navigation-scroll">
          $toc$
        </div>
      </nav>
      <button class="navigation-scrim" type="button" aria-label="$navigation-close$" hidden></button>
      $endif$

      <main class="manual-content">
        <div class="manual-breadcrumb" aria-hidden="true">
          <span>$manual-label$</span><span>/</span><span id="current-section-label">$introduction-label$</span>
        </div>
        <article id="manual-article">
          $body$
        </article>
        <footer class="manual-footer">
          <span>TrenchBroom __TB_VERSION__</span>
          <a href="https://github.com/TrenchBroom/TrenchBroom" target="_blank" rel="noopener noreferrer">GitHub</a>
        </footer>
      </main>

      <aside class="page-navigation" aria-label="$page-navigation-label$">
        <div class="page-navigation-title">$page-navigation-label$</div>
        <nav id="page-navigation-links"></nav>
      </aside>
    </div>
  </body>
</html>
